<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>XMO|Model&Motion </title>
		<style>
			 * {
				 margin: 0;
				 padding: 0;
				 box-sizing: border-box;
			 }
			html {
				height: 100%;
				overflow: hidden;
			}
			body {
				min-height: 100%;
				width: 100%;
				margin: 0;
				border: 0;
				padding: 0;
				display: flex;
				flex-direction: column;
				background-color: #000;
				color: #fff;
			}
			.header{
				width: 100%;
				text-align: center;
				position: fixed;
				top:0;
			}
			.container {
				margin: auto;
				padding-top:100px;
				min-height:1000px;
				text-align: center;
			}
			.footer{
				width: 100%;
				text-align: center;
				position: fixed;
				bottom: 0;
			}
			.p {
				width: 100%;
			}
	 /*CSS导航菜单基础样式重置 */
	.menu{
		width: 100%;
		background-color: #333;
			}	
	/* 导航菜单容器 */
	.navbar {
		margin: auto;
		width: 400px;
		font-family: Arial, sans-serif;
			}
	/* 菜单样式 */
        .nav-list {
            list-style-type: none;
            display: flex;
        }
        
        .nav-list > li {
            position: relative;
        }
        
        .nav-list a {
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        
        /* 悬停效果 */
        .nav-list a:hover {
            background-color: #555;
        }

		</style>
	</head>
	<body>
		<div class="header">
			<div class="menu">
				<nav class="navbar">
				<ul class="nav-list">
					<li><a href="http://maas.xmo.com">模型服务</a></li>
					<li><a href="http://pic.xmo.com">内容制作</a></li>
					<li><a href="http://maas.xmo.com">登录</a></li>
				</ul>
				</nav>
			</div>
			<h1 style="font-size:30px;margin-top:20px;">XMO | Model&Motion</h1>
		</div>
		<div id="home" class="container">
			<p style="color:red;font-size:28px;margin-top:200px;">Model as a Service | 模型即服务</p>
		</div>
		<div class="footer">
			<p style="color:red;font-size:42px;">XMO | Model&Motion</p>
		        <p style="font-size:16px;line-height:30px;">help@XMO.com</p>
		</div>
	</body>
</html>
